name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$null, [ref]$errors)
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::$($_.Message)" }
            exit 1
          }
          Write-Host "parse ok"

      - name: Parse with Windows PowerShell 5.1
        # pwsh is 7.x, which accepts syntax 5.1 rejects -- || and && chain operators
        # most of all. The documented invocation is `powershell -File`, i.e. 5.1, so
        # parsing only under 7 let a hard parse error ship.
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\install.ps1), [ref]$null, [ref]$errors)
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::5.1: $($_.Message)" }
            exit 1
          }
          Write-Host "5.1 parse ok"

      - name: Lint
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $r = Invoke-ScriptAnalyzer -Path ./install.ps1 -Recurse -Severity Error,Warning
          if ($r) { $r | Format-Table -AutoSize | Out-String | Write-Host }
          if ($r | Where-Object { $_.Severity -eq 'Error' }) { exit 1 }
          Write-Host "lint ok"

      - name: Test
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck -MinimumVersion 5.5.0
          Import-Module Pester -MinimumVersion 5.5.0
          $c = New-PesterConfiguration
          $c.Run.Path = './tests'
          $c.Run.PassThru = $true
          $c.Output.Verbosity = 'Detailed'
          $r = Invoke-Pester -Configuration $c

          # Emit each failure as an annotation. Job logs need admin rights to read,
          # but annotations are public on a public repo -- so this is what makes a
          # red build diagnosable by anyone who can see the repo.
          foreach ($t in $r.Failed) {
            $msg = "$($t.ExpandedPath): $($t.ErrorRecord[0].Exception.Message)" -replace "`r?`n", ' '
            Write-Host "::error title=pester::$msg"
          }
          Write-Host "passed=$($r.PassedCount) failed=$($r.FailedCount) skipped=$($r.SkippedCount)"
          if ($r.FailedCount -gt 0) { exit 1 }

      - name: Dry run
        shell: pwsh
        run: |
          # Exercises release resolution end to end. The runner has no WSL, which is
          # itself worth covering: the script must report that and stop cleanly.
          ./install.ps1 -DryRun
